    <!-- JAVASCRIPT GAME ENGINE -->
    <script>
        // Sound Synthesizer using Web Audio API
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playBeep(freq = 440, type = 'sine', duration = 0.1) {
                if (!this.enabled) return;
                this.init();
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) {}
            }

            playSuccess() {
                if (!this.enabled) return;
                this.playBeep(523.25, 'triangle', 0.1);
                setTimeout(() => this.playBeep(659.25, 'triangle', 0.1), 100);
                setTimeout(() => this.playBeep(783.99, 'triangle', 0.2), 200);
            }

            playFail() {
                if (!this.enabled) return;
                this.playBeep(220, 'sawtooth', 0.15);
                setTimeout(() => this.playBeep(180, 'sawtooth', 0.25), 150);
            }
        }

        // Main Application & Logic Engine
        class CipherEngine {
            constructor() {
                this.sound = new SoundEngine();
                this.playerName = "Agen Secret";
                this.xp = 0;
                this.level = 1;
                this.coins = 50;
                this.hearts = 3;
                this.totalScore = 0;
                this.totalSolved = 0;
                this.totalAttempts = 0;
                this.correctAnswers = 0;
                this.playTimeSeconds = 0;
                this.timerInterval = null;
                this.globalTimer = null;

                this.currentMode = null;
                this.currentQuestionIndex = 0;
                this.totalQuestions = 10;
                this.currentQuestion = null;
                this.modeTimer = 0;

                this.badges = [
                    { id: 'first_win', name: 'Misi Pertama', icon: '🎯', desc: 'Selesaikan 1 misi', unlocked: false },
                    { id: 'master_dec', name: 'Master Dekripsi', icon: '🔑', desc: 'Jawab 10 soal dengan benar', unlocked: false },
                    { id: 'speed_demon', name: 'Kilat Sempurna', icon: '⚡', desc: 'Selesaikan Time Attack', unlocked: false },
                    { id: 'boss_slayer', name: 'Mainframe Crusher', icon: '👾', desc: 'Kalahkan Boss Battle', unlocked: false }
                ];

                this.wordBank = [
                    "RAHASIA", "AGEN", "CIPHER", "SANDI", "ENKRIPSI", "DEKRIPSI", "SERVER",
                    "KOMPUTER", "KODE", "HACKER", "JARINGAN", "INTERNET", "SECURITY", "DATA",
                    "SYSTEM", "MATRIX", "LOCK", "KEY", "MATEMATIKA", "INFORMATIKA"
                ];

                this.sentenceBank = [
                    "KIRIM PASUKAN KELOKASI RAHASIA",
                    "AMANKAN DOKUMEN DENGAN ENKRIPSI",
                    "KODE HACKER TELAH DIDETEKSI",
                    "SISTEM KEAMANAN DALAM BAHAYA",
                    "TUGAS AGEN ADALAH MENJAGA DATA"
                ];

                this.impossibleBank = [
                    "Agen #007: Misi Ke-2 Berhasil!",
                    "Kunci Utama: X9-Cipher_2026",
                    "Kriptografi Adalah Seni Memproteksi Data!",
                    "Akses Ditolak! Masukkan Passcode: 9876",
                    "Pesan Terakhir Dari Pusat... S.O.S!"
                ];
            }

            init() {
                this.bindEvents();
                this.renderBadges();
                this.setupParticleBackground();
                this.setupCipherWheelUI();
                this.startGlobalTimer();
            }

            bindEvents() {
                document.getElementById('btn-start-game').addEventListener('click', () => {
                    const inputName = document.getElementById('player-name-input').value.trim();
                    if (inputName) this.playerName = inputName;
                    document.getElementById('welcome-agent-msg').innerText = `Selamat bertugas, Agen ${this.playerName}!`;
                    this.showView('view-menu');
                });

                document.getElementById('audio-toggle').addEventListener('click', (e) => {
                    this.sound.enabled = !this.sound.enabled;
                    e.target.innerText = this.sound.enabled ? '🔊' : '🔇';
                });

                document.getElementById('btn-open-dashboard').addEventListener('click', () => {
                    this.updateDashboardUI();
                    this.showView('view-dashboard');
                });

                document.getElementById('btn-open-playground').addEventListener('click', () => {
                    this.showView('view-playground');
                });

                document.getElementById('btn-submit-text').addEventListener('click', () => {
                    const ans = document.getElementById('game-text-answer').value.trim().toUpperCase();
                    this.checkAnswer(ans);
                });

                document.getElementById('game-text-answer').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        const ans = document.getElementById('game-text-answer').value.trim().toUpperCase();
                        this.checkAnswer(ans);
                    }
                });
            }

            showView(viewId) {
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                document.getElementById(viewId).classList.add('active');
            }

            updateHUD() {
                document.getElementById('hud-xp').innerText = this.xp;
                document.getElementById('hud-level').innerText = `LVL ${this.level}`;
                document.getElementById('hud-coins').innerText = this.coins;
                
                let heartStr = '';
                for (let i = 0; i < 3; i++) {
                    heartStr += i < this.hearts ? '❤️' : '🖤';
                }
                document.getElementById('hud-hearts').innerText = heartStr;
            }

            addXP(amount) {
                this.xp += amount;
                const newLevel = Math.floor(this.xp / 100) + 1;
                if (newLevel > this.level) {
                    this.level = newLevel;
                    this.sound.playSuccess();
                }
                this.updateHUD();
            }

            // Caesar Cipher Helper Algorithms
            caesarShiftChar(char, shift, isDecrypt = false) {
                const code = char.charCodeAt(0);
                let effectiveShift = isDecrypt ? (26 - (shift % 26)) % 26 : shift % 26;

                // Capital A-Z
                if (code >= 65 && code <= 90) {
                    return String.fromCharCode(((code - 65 + effectiveShift) % 26) + 65);
                }
                // Lowercase a-z
                if (code >= 97 && code <= 122) {
                    return String.fromCharCode(((code - 97 + effectiveShift) % 26) + 97);
                }
                // Numbers 0-9
                if (code >= 48 && code <= 57) {
                    let numShift = isDecrypt ? (10 - (shift % 10)) % 10 : shift % 10;
                    return String.fromCharCode(((code - 48 + numShift) % 10) + 48);
                }
                return char; // Punctuation/Spaces unchanged
            }

            caesarTransform(text, shift, isDecrypt = false) {
                return text.split('').map(c => this.caesarShiftChar(c, shift, isDecrypt)).join('');
            }

            // Game Logic & Modes Execution
            startMode(mode) {
                this.currentMode = mode;
                this.currentQuestionIndex = 0;
                this.hearts = 3;
                this.updateHUD();
                
                document.getElementById('wheel-view-container').style.display = 'none';
                document.getElementById('detective-controls').style.display = 'none';
                document.getElementById('mc-options-container').style.display = 'grid';
                document.getElementById('text-input-container').style.display = 'none';

                if (mode === 'timeattack') {
                    this.modeTimer = 60;
                    this.startTimer(() => this.endGameMode("Waktu Time Attack Habis!"));
                } else if (mode === 'impossible') {
                    this.modeTimer = 300;
                    this.startTimer(() => this.endGameMode("Waktu Impossible Mode Habis!"));
                } else {
                    this.stopTimer();
                    document.getElementById('game-timer').innerText = '⏳ ∞';
                }

                this.showView('view-gameplay');
                this.nextQuestion();
            }

            nextQuestion() {
                if (this.currentQuestionIndex >= this.totalQuestions && this.currentMode !== 'timeattack') {
                    this.endGameMode("Misi Berhasil Diselesaikan!");
                    return;
                }

                this.currentQuestionIndex++;
                document.getElementById('game-text-answer').value = '';

                // Progress Bar
                const progPct = ((this.currentQuestionIndex - 1) / this.totalQuestions) * 100;
                document.getElementById('game-progress-fill').style.width = `${Math.min(progPct, 100)}%`;

                // Generate Question according to Mode
                const shift = Math.floor(Math.random() * 10) + 1;
                let originalText = "";
                let cipherText = "";
                let modeTitle = "";

                switch(this.currentMode) {
                    case 'learn':
                        modeTitle = "MODE 1: BELAJAR & MAIN";
                        if (this.currentQuestionIndex <= 3) {
                            // Single Letter
                            originalText = String.fromCharCode(65 + Math.floor(Math.random() * 26));
                            cipherText = this.caesarTransform(originalText, shift);
                            this.setupMCQuestion(originalText, cipherText, shift, "Dekripsi Huruf Tunggal berikut:");
                        } else if (this.currentQuestionIndex <= 6) {
                            // Encrypt word
                            originalText = this.getRandomWord();
                            cipherText = this.caesarTransform(originalText, shift);
                            this.setupMCQuestion(cipherText, originalText, shift, "Enkripsi kata ini (Plaintext -> Ciphertext):", false);
                        } else if (this.currentQuestionIndex <= 8) {
                            // Decrypt word
                            originalText = this.getRandomWord();
                            cipherText = this.caesarTransform(originalText, shift);
                            this.setupMCQuestion(originalText, cipherText, shift, "Dekripsi kata ini (Ciphertext -> Plaintext):");
                        } else {
                            // Visual Wheel Mode
                            originalText = this.getRandomWord();
                            cipherText = this.caesarTransform(originalText, shift);
                            document.getElementById('wheel-view-container').style.display = 'flex';
                            this.rotateWheel(shift);
                            this.setupMCQuestion(originalText, cipherText, shift, "Gunakan Cipher Wheel untuk mendekripsi:");
                        }
                        break;

                    case 'timeattack':
                        modeTitle = "MODE 2: TIME ATTACK";
                        originalText = this.getRandomWord();
                        cipherText = this.caesarTransform(originalText, shift);
                        this.setupMCQuestion(originalText, cipherText, shift, "Dekripsi Cepat!");
                        break;

                    case 'escaperoom':
                        modeTitle = `MODE 3: ESCAPE ROOM (PINTU ${this.currentQuestionIndex}/5)`;
                        originalText = this.getRandomWord();
                        cipherText = this.caesarTransform(originalText, shift);
                        this.setupTextInputQuestion(originalText, cipherText, shift, "Buka Kunci Pintu dengan Kata Kunci Plaintext:");
                        break;

                    case 'boss':
                        modeTitle = "MODE 4: BOSS BATTLE";
                        originalText = this.sentenceBank[Math.floor(Math.random() * this.sentenceBank.length)];
                        cipherText = this.caesarTransform(originalText, shift);
                        this.setupTextInputQuestion(originalText, cipherText, shift, "Hancurkan Pertahanan Mainframe Boss! Dekripsi Kalimat:");
                        break;

                    case 'detective':
                        modeTitle = "MODE 5: CIPHER DETECTIVE";
                        originalText = this.getRandomWord();
                        cipherText = this.caesarTransform(originalText, shift);
                        document.getElementById('detective-controls').style.display = 'block';
                        document.getElementById('mc-options-container').style.display = 'none';
                        document.getElementById('text-input-container').style.display = 'block';
                        this.setupDetectiveQuestion(originalText, cipherText);
                        break;

                    case 'impossible':
                        modeTitle = "MODE 6: IMPOSSIBLE MODE";
                        originalText = this.impossibleBank[Math.floor(Math.random() * this.impossibleBank.length)];
                        cipherText = this.caesarTransform(originalText, shift);
                        this.setupTextInputQuestion(originalText, cipherText, shift, "Super Complex Cipher (Karakter & Angka):");
                        break;
                }

                document.getElementById('game-mode-title').innerText = modeTitle;
                document.getElementById('game-sub-info').innerText = `Tantangan #${this.currentQuestionIndex}`;
            }

            getRandomWord() {
                return this.wordBank[Math.floor(Math.random() * this.wordBank.length)];
            }

            setupMCQuestion(answer, cipherText, shift, label, isDecrypting = true) {
                this.currentQuestion = { answer, cipherText, shift };
                document.getElementById('cipher-label').innerText = label;
                document.getElementById('cipher-display').innerText = cipherText;
                document.getElementById('shift-info').innerText = `Shift Key: +${shift}`;

                // Options Generation
                const options = [answer];
                while (options.length < 4) {
                    let fake = isDecrypting ? this.getRandomWord() : this.caesarTransform(this.getRandomWord(), shift);
                    if (fake.length === answer.length && !options.includes(fake)) {
                        options.push(fake);
                    } else if (!options.includes(fake) && options.length < 4) {
                        options.push(fake);
                    }
                }
                options.sort(() => Math.random() - 0.5);

                const grid = document.getElementById('mc-options-container');
                grid.innerHTML = '';
                options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = opt;
                    btn.onclick = () => this.checkAnswer(opt);
                    grid.appendChild(btn);
                });
            }

            setupTextInputQuestion(answer, cipherText, shift, label) {
                this.currentQuestion = { answer, cipherText, shift };
                document.getElementById('cipher-label').innerText = label;
                document.getElementById('cipher-display').innerText = cipherText;
                document.getElementById('shift-info').innerText = `Shift Key: +${shift}`;
                document.getElementById('mc-options-container').style.display = 'none';
                document.getElementById('text-input-container').style.display = 'block';
            }

            setupDetectiveQuestion(answer, cipherText) {
                this.currentQuestion = { answer, cipherText, shift: null };
                document.getElementById('cipher-label').innerText = "Cari Kunci Shift & Dekripsi Teks!";
                document.getElementById('cipher-display').innerText = cipherText;
                document.getElementById('shift-info').innerText = `Shift Key: UNKNOWN ❓`;
                this.onDetectiveSliderChange(1);
            }

            onDetectiveSliderChange(val) {
                document.getElementById('detective-shift-val').innerText = `Pilihan Shift: ${val}`;
                if (this.currentQuestion) {
                    const live = this.caesarTransform(this.currentQuestion.cipherText, parseInt(val), true);
                    document.getElementById('detective-live-text').innerText = live;
                }
            }

            adjustDetectiveShift(delta) {
                const slider = document.getElementById('detective-slider');
                let newVal = parseInt(slider.value) + delta;
                if (newVal >= 1 && newVal <= 25) {
                    slider.value = newVal;
                    this.onDetectiveSliderChange(newVal);
                }
            }

            checkAnswer(userAns) {
                this.totalAttempts++;
                const isCorrect = userAns.toUpperCase() === this.currentQuestion.answer.toUpperCase();

                if (isCorrect) {
                    this.sound.playSuccess();
                    this.addXP(20);
                    this.coins += 5;
                    this.totalScore += 100;
                    this.totalSolved++;
                    this.correctAnswers++;
                    this.updateHUD();

                    if (this.totalSolved >= 10) this.unlockBadge('master_dec');
                    this.nextQuestion();
                } else {
                    this.sound.playFail();
                    this.hearts--;
                    this.updateHUD();

                    if (this.hearts <= 0) {
                        this.endGameMode("Nyawa Habis! Misi Gagal.");
                    } else {
                        alert(`Jawaban Salah! Sisa nyawa: ${this.hearts}`);
                    }
                }
            }

            useHint(type) {
                if (!this.currentQuestion) return;

                if (type === 'firstLetter') {
                    if (this.coins >= 15) {
                        this.coins -= 15;
                        this.updateHUD();
                        alert(`Huruf Pertama Jawaban: "${this.currentQuestion.answer.charAt(0)}"`);
                    } else alert("Koin tidak cukup!");
                } else if (type === 'length') {
                    if (this.coins >= 10) {
                        this.coins -= 10;
                        this.updateHUD();
                        alert(`Panjang Karakter: ${this.currentQuestion.answer.length} Huruf`);
                    } else alert("Koin tidak cukup!");
                } else if (type === 'category') {
                    if (this.coins >= 10) {
                        this.coins -= 10;
                        this.updateHUD();
                        alert(`Kategori: Kriptografi / Operasi Rahasia Agent`);
                    } else alert("Koin tidak cukup!");
                }
            }

            startTimer(onExpire) {
                this.stopTimer();
                this.timerInterval = setInterval(() => {
                    this.modeTimer--;
                    document.getElementById('game-timer').innerText = `⏳ ${this.modeTimer}s`;
                    if (this.modeTimer <= 0) {
                        this.stopTimer();
                        onExpire();
                    }
                }, 1000);
            }

            stopTimer() {
                if (this.timerInterval) clearInterval(this.timerInterval);
            }

            startGlobalTimer() {
                this.globalTimer = setInterval(() => {
                    this.playTimeSeconds++;
                }, 1000);
            }

            endGameMode(msg) {
                this.stopTimer();
                this.unlockBadge('first_win');
                if (this.currentMode === 'timeattack') this.unlockBadge('speed_demon');
                if (this.currentMode === 'boss') this.unlockBadge('boss_slayer');

                document.getElementById('modal-title').innerText = msg;
                document.getElementById('modal-stats').innerHTML = `
                    <p><strong>Total Skor Diterima:</strong> ${this.totalScore}</p>
                    <p><strong>Soal Berhasil Diberantas:</strong> ${this.correctAnswers}</p>
                    <p><strong>Akurasi Bertugas:</strong> ${this.totalAttempts > 0 ? Math.round((this.correctAnswers/this.totalAttempts)*100) : 0}%</p>
                `;
                document.getElementById('modal-overlay').classList.add('active');
            }

            closeModal() {
                document.getElementById('modal-overlay').classList.remove('active');
                this.showView('view-menu');
            }

            exitToMenu() {
                this.stopTimer();
                this.showView('view-menu');
            }

            // Interactive Playground Feature
            runPlayground(type = 'encrypt') {
                const input = document.getElementById('pg-input').value;
                const shift = parseInt(document.getElementById('pg-shift').value);
                const isDecrypt = type === 'decrypt';

                const output = this.caesarTransform(input, shift, isDecrypt);
                document.getElementById('pg-output').innerText = output || '-';

                // Render Visual Steps
                const container = document.getElementById('pg-steps');
                container.innerHTML = '';
                
                input.split('').forEach(char => {
                    if (char.trim() === '') return;
                    const resChar = this.caesarShiftChar(char, shift, isDecrypt);
                    const card = document.createElement('div');
                    card.className = 'step-card';
                    card.innerHTML = `
                        <div class="orig">${char}</div>
                        <div class="arrow">↓ (+${shift})</div>
                        <div class="res">${resChar}</div>
                    `;
                    container.appendChild(card);
                });
            }

            // Dashboard & Achievements UI Rendering
            unlockBadge(id) {
                const badge = this.badges.find(b => b.id === id);
                if (badge && !badge.unlocked) {
                    badge.unlocked = true;
                    this.renderBadges();
                }
            }

            renderBadges() {
                const container = document.getElementById('badge-container');
                if (!container) return;
                container.innerHTML = '';
                this.badges.forEach(b => {
                    const el = document.createElement('div');
                    el.className = `badge-item ${b.unlocked ? 'unlocked' : ''}`;
                    el.innerHTML = `
                        <div class="badge-icon">${b.icon}</div>
                        <div class="badge-name">${b.name}</div>
                    `;
                    el.title = b.desc;
                    container.appendChild(el);
                });
            }

            updateDashboardUI() {
                document.getElementById('dash-score').innerText = this.totalScore;
                document.getElementById('dash-solved').innerText = this.totalSolved;
                document.getElementById('dash-time').innerText = `${this.playTimeSeconds}s`;
                
                const acc = this.totalAttempts > 0 ? Math.round((this.correctAnswers / this.totalAttempts) * 100) : 0;
                document.getElementById('dash-accuracy').innerText = `${acc}%`;

                // Leaderboard Simulation
                const tbody = document.getElementById('leaderboard-body');
                tbody.innerHTML = `
                    <tr><td>#1</td><td>Agen ${this.playerName} (Kamu)</td><td>${this.totalScore}</td><td>${this.playTimeSeconds}s</td></tr>
                    <tr><td>#2</td><td>Agen CipherX</td><td>850</td><td>120s</td></tr>
                    <tr><td>#3</td><td>Agen Phantom</td><td>600</td><td>240s</td></tr>
                `;

                this.renderChart();
            }

            renderChart() {
                const canvas = document.getElementById('score-chart');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Simple Canvas Line Drawing Simulation
                ctx.beginPath();
                ctx.strokeStyle = '#00f3ff';
                ctx.lineWidth = 3;
                ctx.moveTo(10, 130);
                ctx.lineTo(80, 100);
                ctx.lineTo(160, 110);
                ctx.lineTo(240, 50);
                ctx.lineTo(320, 20);
                ctx.stroke();
            }

            // Dynamic Cipher Wheel Rendering
            setupCipherWheelUI() {
                const outer = document.getElementById('wheel-outer');
                const inner = document.getElementById('wheel-inner');
                if (!outer || !inner) return;

                const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
                const total = 26;

                for (let i = 0; i < total; i++) {
                    const angle = (i / total) * 360;
                    
                    const outerLetter = document.createElement('div');
                    outerLetter.className = 'wheel-letter';
                    outerLetter.innerText = alphabet[i];
                    outerLetter.style.transform = `rotate(${angle}deg) translateY(-105px)`;
                    outer.appendChild(outerLetter);

                    const innerLetter = document.createElement('div');
                    innerLetter.className = 'wheel-letter';
                    innerLetter.innerText = alphabet[i];
                    innerLetter.style.transform = `rotate(${angle}deg) translateY(-72px)`;
                    inner.appendChild(innerLetter);
                }
            }

            rotateWheel(shift) {
                const inner = document.getElementById('wheel-inner');
                if (inner) {
                    const angle = (shift / 26) * 360;
                    inner.style.transform = `rotate(-${angle}deg)`;
                }
            }

            // Canvas Dynamic Particle Background
            setupParticleBackground() {
                const canvas = document.getElementById('particle-canvas');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');

                let width = (canvas.width = window.innerWidth);
                let height = (canvas.height = window.innerHeight);

                window.addEventListener('resize', () => {
                    width = canvas.width = window.innerWidth;
                    height = canvas.height = window.innerHeight;
                });

                const particles = Array.from({ length: 40 }, () => ({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 2 + 1,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    alpha: Math.random() * 0.5 + 0.2
                }));

                function animate() {
                    ctx.clearRect(0, 0, width, height);
                    particles.forEach(p => {
                        p.x += p.vx;
                        p.y += p.vy;

                        if (p.x < 0) p.x = width;
                        if (p.x > width) p.x = 0;
                        if (p.y < 0) p.y = height;
                        if (p.y > height) p.y = 0;

                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(0, 243, 255, ${p.alpha})`;
                        ctx.fill();
                    });
                    requestAnimationFrame(animate);
                }
                animate();
            }
        }

        // Initialize App Instance on DOM Load
        let app;
        document.addEventListener('DOMContentLoaded', () => {
            app = new CipherEngine();
            app.init();
        });
    </script>
</body>
